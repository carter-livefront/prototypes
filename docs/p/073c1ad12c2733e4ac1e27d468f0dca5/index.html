<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet" />
<meta name="referrer" content="no-referrer" />
<title>Forge — Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500;9..144,600;9..144,700&family=Inter+Tight:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d1014;
    --surface: #161b2230;
    --surface-2: #181d25;
    --surface-elevated: #1f252f;
    --border: #262d38;
    --border-soft: #1c222b;
    --ink: #eef2f7;
    --ink-dim: #9aa3b2;
    --ink-faint: #5e6776;
    --accent: #5b8def;     /* cool steel blue */
    --accent-2: #7cc4ff;   /* lighter ice blue */
    --accent-soft: #5b8def1a;
    --accent-glow: #5b8def40;
    --gold: #8ab4d8;       /* repurposed as a soft slate-blue secondary */
    --success: #6cc4a1;
    --shadow: 0 1px 0 rgba(255,255,255,0.04) inset, 0 12px 40px rgba(0,0,0,0.5);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  html, body {
    height: 100%;
    overflow: hidden;
  }

  body {
    background: var(--bg);
    color: var(--ink);
    font-family: 'Inter Tight', system-ui, sans-serif;
    font-size: 15px;
    line-height: 1.4;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
  }

  /* Phone frame */
  .phone {
    width: 390px;
    height: 100vh;
    max-height: 844px;
    background: var(--bg);
    position: relative;
    overflow: hidden;
    border-radius: 0;
    display: flex;
    flex-direction: column;
  }

  @media (min-width: 500px) {
    .phone {
      border-radius: 44px;
      border: 1px solid var(--border);
      box-shadow: 0 30px 80px rgba(0,0,0,0.6);
      max-height: 844px;
    }
  }

  /* Subtle texture overlay */
  .phone::before {
    content: '';
    position: absolute;
    inset: 0;
    background-image:
      radial-gradient(ellipse at top, rgba(91, 141, 239, 0.10), transparent 60%),
      radial-gradient(ellipse at bottom right, rgba(124, 196, 255, 0.05), transparent 50%),
      radial-gradient(ellipse at bottom left, rgba(138, 180, 216, 0.04), transparent 55%);
    pointer-events: none;
    z-index: 0;
  }

  /* Status bar */
  .status-bar {
    height: 50px;
    padding: 18px 28px 0;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    font-size: 14px;
    font-weight: 600;
    color: var(--ink);
    flex-shrink: 0;
    position: relative;
    z-index: 2;
  }

  .status-icons {
    display: flex;
    gap: 6px;
    align-items: center;
  }

  /* Header */
  .header {
    padding: 16px 24px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-shrink: 0;
    position: relative;
    z-index: 2;
  }

  .greeting-label {
    font-size: 11px;
    color: var(--ink-faint);
    text-transform: uppercase;
    letter-spacing: 0.14em;
    font-weight: 500;
    margin-bottom: 4px;
  }

  .greeting {
    font-family: 'Fraunces', serif;
    font-size: 28px;
    font-weight: 400;
    letter-spacing: -0.02em;
    line-height: 1;
  }

  .greeting em {
    font-style: italic;
    color: var(--accent);
  }

  .avatar {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: linear-gradient(135deg, #5b8def 0%, #7cc4ff 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 14px;
    color: var(--bg);
    border: 1px solid var(--border);
  }

  /* Main scroll area */
  .main {
    flex: 1;
    overflow-y: auto;
    overflow-x: hidden;
    position: relative;
    z-index: 1;
    padding: 0 0 100px;
    -webkit-overflow-scrolling: touch;
  }

  .main::-webkit-scrollbar { display: none; }

  /* Block container */
  .blocks {
    display: flex;
    flex-direction: column;
    gap: 32px;
    padding: 8px 0 0;
  }

  .block {
    animation: blockIn 0.5s cubic-bezier(0.2, 0.8, 0.2, 1) backwards;
  }

  @keyframes blockIn {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* Block header */
  .block-header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding: 0 24px 14px;
  }

  .block-title-group {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .block-eyebrow {
    font-size: 10px;
    color: var(--ink-faint);
    text-transform: uppercase;
    letter-spacing: 0.16em;
    font-weight: 500;
  }

  .block-title {
    font-family: 'Fraunces', serif;
    font-size: 22px;
    font-weight: 500;
    letter-spacing: -0.01em;
    color: var(--ink);
  }

  .ellipses-btn {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: transparent;
    border: none;
    color: var(--ink-dim);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: background 0.2s ease;
    align-self: center;
    margin-top: 8px;
  }

  .ellipses-btn:active { background: var(--surface-2); }

  /* Carousel */
  .carousel {
    display: flex;
    gap: 12px;
    overflow-x: auto;
    overflow-y: hidden;
    padding: 4px 24px 4px;
    scroll-padding-left: 24px;
    scroll-snap-type: x mandatory;
    -webkit-overflow-scrolling: touch;
  }

  .carousel::-webkit-scrollbar { display: none; }

  /* Trailing spacer so the last card has breathing room on the right */
  .carousel::after {
    content: '';
    flex: 0 0 12px;
  }

  .card {
    flex: 0 0 240px;
    min-height: 200px;
    background: var(--surface-2);
    border: 1px solid var(--border-soft);
    border-radius: 18px;
    padding: 18px;
    scroll-snap-align: start;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    position: relative;
    overflow: hidden;
    transition: transform 0.2s ease, border-color 0.2s ease;
  }

  .card:active {
    transform: scale(0.98);
    border-color: var(--border);
  }

  .card-tag {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--ink-dim);
    padding: 4px 8px;
    background: rgba(255,255,255,0.04);
    border-radius: 4px;
    align-self: flex-start;
  }

  .card-tag::before {
    content: '';
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: var(--accent);
  }

  .card-title {
    font-family: 'Fraunces', serif;
    font-size: 19px;
    font-weight: 500;
    line-height: 1.15;
    letter-spacing: -0.01em;
    margin-top: 12px;
  }

  .card-meta {
    display: flex;
    flex-direction: column;
    gap: 4px;
    margin-top: 12px;
    font-size: 12px;
    color: var(--ink-dim);
  }

  .card-meta-row {
    display: flex;
    justify-content: space-between;
  }

  .card-meta-row .v { color: var(--ink); font-weight: 500; }

  /* Insights cards (default) */
  .card-insight {
    background: var(--surface-2);
    border: 1px solid var(--border-soft);
    min-height: 180px;
  }

  .card-insight.featured {
    background: linear-gradient(155deg, #1a2436 0%, #1d2a40 50%, #181d25 100%);
    border-color: #2c3a52;
  }

  .insight-stat {
    font-family: 'Fraunces', serif;
    font-size: 44px;
    font-weight: 300;
    letter-spacing: -0.03em;
    line-height: 1;
    margin: 8px 0 4px;
  }

  .insight-stat .unit {
    font-size: 18px;
    color: var(--ink-dim);
    margin-left: 2px;
  }

  .insight-trend {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 12px;
    font-weight: 500;
    color: var(--success);
    margin-top: 6px;
  }

  .insight-trend.down { color: #d8a36b; }

  .insight-label {
    font-size: 13px;
    color: var(--ink-dim);
    margin-top: auto;
    padding-top: 8px;
  }

  /* Sparkline */
  .sparkline {
    margin-top: 8px;
    height: 32px;
    width: 100%;
  }

  /* Add Block placeholder */
  .add-block {
    margin: 0 24px;
    padding: 28px 24px;
    border-radius: 18px;
    border: 1.5px dashed var(--border);
    background: transparent;
    color: var(--ink-dim);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s ease;
    width: calc(100% - 48px);
  }

  .add-block:active {
    background: var(--surface);
    border-color: var(--accent);
    color: var(--accent);
  }

  .add-block-icon {
    width: 22px;
    height: 22px;
    border-radius: 50%;
    border: 1.5px solid currentColor;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    line-height: 1;
    font-weight: 300;
  }

  /* Chat dock */
  .chat-dock {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    padding: 14px 20px 28px;
    background: linear-gradient(to top, rgba(13, 16, 20, 0.98) 60%, rgba(13, 16, 20, 0));
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    z-index: 10;
  }

  .chat-field {
    width: 100%;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 100px;
    padding: 14px 18px 14px 16px;
    display: flex;
    align-items: center;
    gap: 12px;
    cursor: pointer;
    color: var(--ink-dim);
    font-family: inherit;
    text-align: left;
    transition: border-color 0.2s ease, background 0.2s ease;
    position: relative;
    overflow: hidden;
  }

  .chat-field::before {
    content: '';
    position: absolute;
    inset: -1px;
    border-radius: 100px;
    padding: 1px;
    background: linear-gradient(135deg, var(--accent) 0%, var(--accent-2) 30%, transparent 50%, transparent 70%, var(--accent) 100%);
    -webkit-mask: linear-gradient(#000, #000) content-box, linear-gradient(#000, #000);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    opacity: 0.55;
    pointer-events: none;
  }

  .chat-field:active {
    background: var(--surface-elevated);
  }

  .chat-icon {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--accent) 0%, var(--accent-2) 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--bg);
    flex-shrink: 0;
  }

  .chat-placeholder {
    flex: 1;
    font-size: 15px;
    font-weight: 400;
    color: var(--ink-dim);
    letter-spacing: 0.01em;
  }

  .chat-placeholder em {
    font-style: normal;
    color: var(--accent);
    font-weight: 600;
    letter-spacing: 0.05em;
  }

  .chat-mic {
    color: var(--ink-faint);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  /* Modal / Sheet */
  .scrim {
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.6);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    z-index: 100;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s ease;
  }

  .scrim.show {
    opacity: 1;
    pointer-events: auto;
  }

  .sheet {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    background: #14181f;
    border-top-left-radius: 28px;
    border-top-right-radius: 28px;
    border-top: 1px solid var(--border);
    z-index: 101;
    transform: translateY(100%);
    transition: transform 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
    max-height: 92%;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .sheet.show { transform: translateY(0); }

  .sheet-handle {
    width: 36px;
    height: 4px;
    background: var(--border);
    border-radius: 2px;
    margin: 10px auto 0;
    flex-shrink: 0;
  }

  .sheet-header {
    padding: 24px 28px 8px;
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    flex-shrink: 0;
  }

  .sheet-title {
    font-family: 'Fraunces', serif;
    font-size: 24px;
    font-weight: 500;
    letter-spacing: -0.01em;
  }

  .sheet-subtitle {
    color: var(--ink-dim);
    font-size: 13px;
    padding: 0 28px 24px;
    flex-shrink: 0;
  }

  .sheet-body {
    padding: 0 24px;
    flex: 1;
    overflow-y: auto;
  }

  .sheet-body::-webkit-scrollbar { display: none; }

  /* Action menu */
  .action-menu {
    padding: 0 16px 24px;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .action-item {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 16px;
    border-radius: 12px;
    background: transparent;
    border: none;
    color: var(--ink);
    font-size: 16px;
    font-weight: 500;
    cursor: pointer;
    text-align: left;
    width: 100%;
    transition: background 0.15s ease;
  }

  .action-item:active { background: var(--surface-2); }

  .action-item.danger { color: var(--accent); }

  .action-icon {
    width: 36px;
    height: 36px;
    border-radius: 10px;
    background: var(--surface-2);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .action-item.danger .action-icon {
    background: var(--accent-soft);
  }

  .action-meta {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .action-desc {
    font-size: 12px;
    color: var(--ink-faint);
    font-weight: 400;
  }

  /* Prompt input */
  .prompt-form {
    padding: 8px 4px 24px;
  }

  .prompt-label {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--ink-faint);
    margin-bottom: 12px;
  }

  .prompt-input-wrap {
    position: relative;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 16px 18px;
    transition: border-color 0.2s ease;
  }

  .prompt-input-wrap:focus-within {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft);
  }

  .prompt-input {
    width: 100%;
    background: transparent;
    border: none;
    outline: none;
    color: var(--ink);
    font-family: inherit;
    font-size: 15px;
    line-height: 1.5;
    resize: none;
    min-height: 60px;
  }

  .prompt-input::placeholder { color: var(--ink-faint); }

  .prompt-suggestions {
    margin: 16px 0 8px;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }

  .prompt-chip {
    background: var(--surface-2);
    border: 1px solid var(--border-soft);
    border-radius: 100px;
    padding: 8px 14px;
    color: var(--ink-dim);
    font-size: 13px;
    cursor: pointer;
    transition: all 0.15s ease;
  }

  .prompt-chip:active {
    background: var(--accent-soft);
    color: var(--accent);
    border-color: var(--accent);
  }

  .submit-btn {
    width: 100%;
    margin-top: 20px;
    padding: 16px;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 14px;
    font-family: inherit;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.01em;
    cursor: pointer;
    transition: opacity 0.2s ease, transform 0.1s ease;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }

  .submit-btn:active { transform: scale(0.99); }
  .submit-btn:disabled { opacity: 0.4; cursor: not-allowed; }

  /* Reorder mode */
  .reorder-list {
    padding: 0 4px 24px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .reorder-item {
    background: var(--surface-2);
    border: 1px solid var(--border-soft);
    border-radius: 14px;
    padding: 16px;
    display: flex;
    align-items: center;
    gap: 14px;
    cursor: grab;
    user-select: none;
    transition: transform 0.2s ease, opacity 0.2s ease, box-shadow 0.2s ease;
  }

  .reorder-item.dragging {
    opacity: 0.95;
    box-shadow: 0 12px 30px rgba(0,0,0,0.5);
    border-color: var(--accent);
    cursor: grabbing;
    z-index: 10;
  }

  .reorder-handle {
    color: var(--ink-faint);
    flex-shrink: 0;
  }

  .reorder-name {
    font-weight: 500;
    flex: 1;
  }

  .reorder-type {
    font-size: 11px;
    color: var(--ink-faint);
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }

  /* Loading state */
  .loading-card {
    flex: 0 0 240px;
    min-height: 180px;
    background: var(--surface-2);
    border: 1px solid var(--border-soft);
    border-radius: 18px;
    padding: 18px;
    overflow: hidden;
    position: relative;
  }

  .shimmer {
    background: linear-gradient(90deg, var(--surface-2) 0%, var(--surface-elevated) 50%, var(--surface-2) 100%);
    background-size: 200% 100%;
    animation: shimmer 1.4s ease-in-out infinite;
    border-radius: 4px;
  }

  @keyframes shimmer {
    0% { background-position: 200% 0; }
    100% { background-position: -200% 0; }
  }

  .skeleton-tag { height: 12px; width: 60px; margin-bottom: 14px; }
  .skeleton-line { height: 14px; margin-bottom: 8px; }
  .skeleton-line.w-80 { width: 80%; }
  .skeleton-line.w-60 { width: 60%; }
  .skeleton-line.w-40 { width: 40%; }

  .loading-status {
    padding: 0 24px;
    display: flex;
    align-items: center;
    gap: 10px;
    color: var(--ink-dim);
    font-size: 13px;
    font-style: italic;
    font-family: 'Fraunces', serif;
  }

  .pulse-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--accent);
    animation: pulse 1.4s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 0.4; transform: scale(0.8); }
    50% { opacity: 1; transform: scale(1.2); }
  }

  /* Toast */
  .toast {
    position: absolute;
    bottom: 100px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--surface-elevated);
    border: 1px solid var(--border);
    color: var(--ink);
    padding: 12px 20px;
    border-radius: 100px;
    font-size: 13px;
    font-weight: 500;
    z-index: 200;
    opacity: 0;
    pointer-events: none;
    transition: all 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
    box-shadow: 0 12px 30px rgba(0,0,0,0.5);
  }

  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  /* Section divider line for blocks */
  .block-rule {
    margin: 0 24px 14px;
    height: 1px;
    background: linear-gradient(to right, var(--border) 0%, transparent 100%);
  }

  /* Notch decoration */
  .notch {
    position: absolute;
    top: 12px;
    left: 50%;
    transform: translateX(-50%);
    width: 100px;
    height: 26px;
    background: #000;
    border-radius: 100px;
    z-index: 50;
    display: none;
  }

  @media (min-width: 500px) {
    .notch { display: block; }
  }
</style>
</head>
<body>
<div class="phone" id="phone">
  <div class="notch"></div>
  <div class="status-bar">
    <span>9:41</span>
    <div class="status-icons">
      <svg width="18" height="10" viewBox="0 0 18 10" fill="none"><rect x="0.5" y="0.5" width="14" height="9" rx="2" stroke="currentColor" opacity="0.5"/><rect x="2" y="2" width="11" height="6" rx="1" fill="currentColor"/><rect x="15.5" y="3" width="1.5" height="4" rx="0.5" fill="currentColor" opacity="0.5"/></svg>
    </div>
  </div>

  <div class="header">
    <div>
      <div class="greeting-label">Monday · May 4</div>
      <div class="greeting">Morning, <em>Carter</em></div>
    </div>
    <div class="avatar">C</div>
  </div>

  <div class="main">
    <div class="blocks" id="blocks"></div>
  </div>

  <div class="chat-dock">
    <button class="chat-field" id="chat-field" aria-label="Ask L•AI•C">
      <span class="chat-icon">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l1.8 5.6L19 9l-4.5 3.3L16 18l-4-3-4 3 1.5-5.7L5 9l5.2-1.4L12 2z"/></svg>
      </span>
      <span class="chat-placeholder">Ask L<em>•AI•</em>C</span>
      <span class="chat-mic">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0014 0M12 18v3"/></svg>
      </span>
    </button>
  </div>

  <div class="scrim" id="scrim"></div>
  <div class="sheet" id="sheet">
    <div class="sheet-handle"></div>
    <div id="sheet-content"></div>
  </div>

  <div class="toast" id="toast"></div>
</div>

<script>
  // ============= STATE =============
  let blocks = [
    {
      id: 'b_insights',
      type: 'insights',
      title: 'Today\'s Insights',
      eyebrow: 'Overview',
      isDefault: true,
      data: null
    }
  ];

  // Sample AI-generated content templates keyed by prompt themes
  const sampleResponses = {
    strength: {
      title: 'Latest Strength Workouts',
      eyebrow: 'AI · Strength',
      cards: [
        { tag: 'Push', title: 'Heavy Bench & Overhead', meta: [['Volume', '12,400 lb'], ['Duration', '52 min'], ['When', 'Yesterday']] },
        { tag: 'Legs', title: 'Squat Triple Progression', meta: [['Volume', '18,200 lb'], ['Duration', '68 min'], ['When', '3 days ago']] },
        { tag: 'Pull', title: 'Deadlift Top Set', meta: [['Volume', '9,850 lb'], ['Duration', '44 min'], ['When', '5 days ago']] },
        { tag: 'Push', title: 'Incline Press Focus', meta: [['Volume', '8,900 lb'], ['Duration', '48 min'], ['When', 'Last week']] }
      ]
    },
    cardio: {
      title: 'Recent Cardio Sessions',
      eyebrow: 'AI · Cardio',
      cards: [
        { tag: 'Run', title: 'Morning Tempo Run', meta: [['Distance', '5.2 mi'], ['Pace', '7:42 / mi'], ['When', 'Yesterday']] },
        { tag: 'Bike', title: 'Threshold Intervals', meta: [['Distance', '18.4 mi'], ['Avg HR', '162 bpm'], ['When', '2 days ago']] },
        { tag: 'Row', title: 'Steady State Row', meta: [['Distance', '5,000 m'], ['Split', '2:08'], ['When', '4 days ago']] }
      ]
    },
    recovery: {
      title: 'Recovery & Sleep',
      eyebrow: 'AI · Recovery',
      cards: [
        { tag: 'Sleep', title: 'Last Night', meta: [['Total', '7h 24m'], ['Deep', '1h 48m'], ['Score', '84']] },
        { tag: 'HRV', title: 'Weekly Trend', meta: [['Average', '62 ms'], ['Change', '+4 ms'], ['Status', 'Recovered']] },
        { tag: 'Mobility', title: 'Hip Routine', meta: [['Duration', '12 min'], ['When', 'Yesterday'], ['Streak', '6 days']] }
      ]
    },
    nutrition: {
      title: 'Nutrition This Week',
      eyebrow: 'AI · Nutrition',
      cards: [
        { tag: 'Protein', title: 'Daily Average', meta: [['Intake', '168 g'], ['Goal', '180 g'], ['Status', 'On track']] },
        { tag: 'Calories', title: 'Weekly Balance', meta: [['Average', '2,340'], ['Goal', '2,400'], ['Trend', 'Steady']] },
        { tag: 'Hydration', title: 'Water Intake', meta: [['Today', '64 oz'], ['Goal', '96 oz'], ['7d Avg', '88 oz']] }
      ]
    },
    classes: {
      title: 'Upcoming Classes',
      eyebrow: 'AI · Schedule',
      cards: [
        { tag: 'Today', title: 'GTX Strength', meta: [['Time', '5:30 PM'], ['Coach', 'Marcus B.'], ['Spots', '4 open']] },
        { tag: 'Tomorrow', title: 'Yoga Sculpt', meta: [['Time', '6:15 AM'], ['Coach', 'Aly K.'], ['Spots', '8 open']] },
        { tag: 'Wed', title: 'Aqua Power', meta: [['Time', '7:00 AM'], ['Coach', 'Dana R.'], ['Spots', '12 open']] }
      ]
    },
    default: {
      title: 'Your Results',
      eyebrow: 'AI · Custom',
      cards: [
        { tag: 'Top', title: 'Most Recent Activity', meta: [['Type', 'Workout'], ['When', 'Yesterday'], ['Status', 'Logged']] },
        { tag: 'Trend', title: 'This Week', meta: [['Sessions', '4'], ['Total time', '3h 12m'], ['Streak', '6 days']] },
        { tag: 'Goal', title: 'Progress', meta: [['On track', '3 of 4'], ['This month', '18 sessions'], ['Last', 'Yesterday']] }
      ]
    }
  };

  function inferContent(prompt) {
    const p = prompt.toLowerCase();
    if (/strength|lift|squat|bench|deadlift|barbell|weight/.test(p)) return { ...sampleResponses.strength, title: capitalize(prompt) };
    if (/cardio|run|bike|cycle|row|sprint|hiit|tempo/.test(p)) return { ...sampleResponses.cardio, title: capitalize(prompt) };
    if (/sleep|recovery|hrv|rest|mobility/.test(p)) return { ...sampleResponses.recovery, title: capitalize(prompt) };
    if (/nutrition|protein|calorie|food|macro|hydra/.test(p)) return { ...sampleResponses.nutrition, title: capitalize(prompt) };
    if (/class|schedule|booking|gtx|yoga|pilates/.test(p)) return { ...sampleResponses.classes, title: capitalize(prompt) };
    return { ...sampleResponses.default, title: capitalize(prompt) };
  }

  function capitalize(s) {
    return s.split(' ').map(w => w.charAt(0).toUpperCase() + w.slice(1)).join('');
  }

  // ============= RENDERING =============
  const blocksEl = document.getElementById('blocks');
  const scrimEl = document.getElementById('scrim');
  const sheetEl = document.getElementById('sheet');
  const sheetContent = document.getElementById('sheet-content');

  function render() {
    blocksEl.innerHTML = '';
    blocks.forEach((block, idx) => {
      blocksEl.appendChild(renderBlock(block, idx));
    });
    // Add Block placeholder
    const addBtn = document.createElement('button');
    addBtn.className = 'add-block';
    addBtn.innerHTML = '<span class="add-block-icon">+</span> Add block';
    addBtn.onclick = () => openPromptSheet(null);
    blocksEl.appendChild(addBtn);
  }

  function renderBlock(block, idx) {
    const wrap = document.createElement('div');
    wrap.className = 'block';
    wrap.style.animationDelay = `${idx * 0.06}s`;

    if (block.type === 'insights') {
      wrap.innerHTML = `
        <div class="block-header">
          <div class="block-title-group">
            <div class="block-eyebrow">${block.eyebrow}</div>
            <div class="block-title">${block.title}</div>
          </div>
          <button class="ellipses-btn" data-id="${block.id}" aria-label="Block options">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>
          </button>
        </div>
        <div class="carousel">
          <div class="card card-insight featured">
            <div class="card-tag">Readiness</div>
            <div>
              <div class="insight-stat">87<span class="unit">/100</span></div>
              <div class="insight-trend">↑ 6 from yesterday</div>
            </div>
            <div class="insight-label">You're primed for a hard session.</div>
          </div>
          <div class="card card-insight">
            <div class="card-tag">7-day volume</div>
            <div>
              <div class="insight-stat">42,800<span class="unit">lb</span></div>
              <svg class="sparkline" viewBox="0 0 200 32" preserveAspectRatio="none">
                <polyline fill="none" stroke="var(--accent-2)" stroke-width="1.5" points="0,24 25,20 50,22 75,14 100,18 125,10 150,12 175,6 200,8"/>
              </svg>
            </div>
            <div class="insight-label">Up 12% week over week</div>
          </div>
          <div class="card card-insight">
            <div class="card-tag">Sleep</div>
            <div>
              <div class="insight-stat">7:24</div>
              <div class="insight-trend down">↓ 32 min vs avg</div>
            </div>
            <div class="insight-label">Consider an earlier bedtime tonight.</div>
          </div>
          <div class="card card-insight">
            <div class="card-tag">Streak</div>
            <div>
              <div class="insight-stat">14<span class="unit">days</span></div>
              <div class="insight-trend">🔥 Personal best</div>
            </div>
            <div class="insight-label">Active days in a row.</div>
          </div>
        </div>
      `;
    } else if (block.type === 'loading') {
      wrap.innerHTML = `
        <div class="block-header">
          <div class="block-title-group">
            <div class="block-eyebrow">AI · Generating</div>
            <div class="loading-status">
              <span class="pulse-dot"></span>
              <span>${block.statusText || 'Searching your activity…'}</span>
            </div>
          </div>
        </div>
        <div class="carousel">
          ${[1,2,3].map(() => `
            <div class="loading-card">
              <div class="shimmer skeleton-tag"></div>
              <div class="shimmer skeleton-line w-80"></div>
              <div class="shimmer skeleton-line w-60"></div>
              <div style="margin-top:24px">
                <div class="shimmer skeleton-line w-40"></div>
                <div class="shimmer skeleton-line w-60"></div>
                <div class="shimmer skeleton-line w-40"></div>
              </div>
            </div>
          `).join('')}
        </div>
      `;
    } else if (block.type === 'ai') {
      const cards = block.data.cards.map(c => `
        <div class="card">
          <div class="card-tag">${c.tag}</div>
          <div class="card-title">${c.title}</div>
          <div class="card-meta">
            ${c.meta.map(([k,v]) => `<div class="card-meta-row"><span>${k}</span><span class="v">${v}</span></div>`).join('')}
          </div>
        </div>
      `).join('');
      wrap.innerHTML = `
        <div class="block-header">
          <div class="block-title-group">
            <div class="block-eyebrow">${block.eyebrow}</div>
            <div class="block-title">${block.title}</div>
          </div>
          <button class="ellipses-btn" data-id="${block.id}" aria-label="Block options">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>
          </button>
        </div>
        <div class="carousel">${cards}</div>
      `;
    }

    // Wire up ellipses
    setTimeout(() => {
      const btn = wrap.querySelector('.ellipses-btn');
      if (btn) btn.onclick = () => openBlockMenu(block.id);
    }, 0);

    return wrap;
  }

  // ============= SHEETS =============
  function openSheet(html) {
    sheetContent.innerHTML = html;
    scrimEl.classList.add('show');
    sheetEl.classList.add('show');
  }

  function closeSheet() {
    scrimEl.classList.remove('show');
    sheetEl.classList.remove('show');
  }

  scrimEl.onclick = closeSheet;

  function openBlockMenu(blockId) {
    const block = blocks.find(b => b.id === blockId);
    const isInsights = block.type === 'insights';
    openSheet(`
      <div class="sheet-header">
        <div class="sheet-title">Block options</div>
      </div>
      <div class="sheet-subtitle">${block.title}</div>
      <div class="action-menu">
        ${!isInsights ? `
          <button class="action-item" id="act-edit">
            <div class="action-icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4v16h16v-7"/><path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
            </div>
            <div class="action-meta">
              <span>Edit prompt</span>
              <span class="action-desc">Refine the AI search query</span>
            </div>
          </button>
        ` : ''}
        <button class="action-item" id="act-reorder">
          <div class="action-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
          </div>
          <div class="action-meta">
            <span>Reorder blocks</span>
            <span class="action-desc">Drag to rearrange your dashboard</span>
          </div>
        </button>
        ${!isInsights ? `
          <button class="action-item danger" id="act-remove">
            <div class="action-icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"/></svg>
            </div>
            <div class="action-meta">
              <span>Remove block</span>
              <span class="action-desc">Delete from dashboard</span>
            </div>
          </button>
        ` : ''}
      </div>
    `);
    if (!isInsights) {
      document.getElementById('act-edit').onclick = () => openPromptSheet(blockId);
      document.getElementById('act-remove').onclick = () => removeBlock(blockId);
    }
    document.getElementById('act-reorder').onclick = () => openReorderSheet();
  }

  function openPromptSheet(editingBlockId) {
    const editing = editingBlockId ? blocks.find(b => b.id === editingBlockId) : null;
    const initialPrompt = editing ? editing.prompt : '';
    const titleText = editing ? 'Edit block' : 'New block';
    const subtitleText = editing
      ? 'Refine your prompt to update what this block shows.'
      : 'Describe what you\'d like to see. AI will assemble a custom carousel.';

    openSheet(`
      <div class="sheet-header">
        <div class="sheet-title">${titleText}</div>
      </div>
      <div class="sheet-subtitle">${subtitleText}</div>
      <div class="sheet-body">
        <div class="prompt-form">
          <div class="prompt-label">Your prompt</div>
          <div class="prompt-input-wrap">
            <textarea class="prompt-input" id="prompt-input" placeholder="e.g. latest strength workouts">${initialPrompt}</textarea>
          </div>
          <div class="prompt-suggestions">
            <button class="prompt-chip" data-p="Latest strength workouts">Latest strength workouts</button>
            <button class="prompt-chip" data-p="Recent cardio sessions">Recent cardio sessions</button>
            <button class="prompt-chip" data-p="Sleep & recovery this week">Sleep & recovery</button>
            <button class="prompt-chip" data-p="Upcoming classes">Upcoming classes</button>
            <button class="prompt-chip" data-p="Nutrition trends">Nutrition trends</button>
          </div>
          <button class="submit-btn" id="prompt-submit">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l4-9 3 14 4-9 3 4"/></svg>
            ${editing ? 'Update block' : 'Generate block'}
          </button>
        </div>
      </div>
    `);

    const input = document.getElementById('prompt-input');
    setTimeout(() => input.focus(), 350);

    document.querySelectorAll('.prompt-chip').forEach(chip => {
      chip.onclick = () => { input.value = chip.dataset.p; input.focus(); };
    });

    document.getElementById('prompt-submit').onclick = () => {
      const prompt = input.value.trim();
      if (!prompt) return;
      if (editing) {
        updateBlock(editing.id, prompt);
      } else {
        addBlock(prompt);
      }
    };
  }

  function openReorderSheet() {
    const items = blocks.map(b => `
      <div class="reorder-item" draggable="true" data-id="${b.id}">
        <div class="reorder-handle">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h.01M16 6h.01M8 12h.01M16 12h.01M8 18h.01M16 18h.01"/></svg>
        </div>
        <div class="reorder-name">${b.title}</div>
        <div class="reorder-type">${b.type === 'insights' ? 'Default' : 'AI'}</div>
      </div>
    `).join('');

    openSheet(`
      <div class="sheet-header">
        <div class="sheet-title">Reorder blocks</div>
      </div>
      <div class="sheet-subtitle">Drag the handle to rearrange.</div>
      <div class="sheet-body">
        <div class="reorder-list" id="reorder-list">${items}</div>
        <button class="submit-btn" id="reorder-done" style="margin: 0 4px 24px;">Done</button>
      </div>
    `);

    setupDragReorder();
    document.getElementById('reorder-done').onclick = closeSheet;
  }

  // ============= DRAG REORDER =============
  function setupDragReorder() {
    const list = document.getElementById('reorder-list');
    let dragging = null;

    list.querySelectorAll('.reorder-item').forEach(item => {
      item.addEventListener('dragstart', e => {
        dragging = item;
        item.classList.add('dragging');
        e.dataTransfer.effectAllowed = 'move';
      });
      item.addEventListener('dragend', () => {
        item.classList.remove('dragging');
        // Update blocks order
        const newOrder = [...list.querySelectorAll('.reorder-item')].map(el => el.dataset.id);
        blocks.sort((a, b) => newOrder.indexOf(a.id) - newOrder.indexOf(b.id));
        render();
      });
    });

    list.addEventListener('dragover', e => {
      e.preventDefault();
      const afterEl = getDragAfterElement(list, e.clientY);
      if (!dragging) return;
      if (afterEl == null) list.appendChild(dragging);
      else list.insertBefore(dragging, afterEl);
    });

    // Touch fallback
    list.querySelectorAll('.reorder-item').forEach(item => {
      let touchY = 0;
      let initialIndex = 0;
      item.addEventListener('touchstart', e => {
        dragging = item;
        item.classList.add('dragging');
        touchY = e.touches[0].clientY;
        initialIndex = [...list.children].indexOf(item);
      }, { passive: true });

      item.addEventListener('touchmove', e => {
        if (!dragging) return;
        e.preventDefault();
        const y = e.touches[0].clientY;
        const afterEl = getDragAfterElement(list, y);
        if (afterEl == null) list.appendChild(dragging);
        else if (afterEl !== dragging) list.insertBefore(dragging, afterEl);
      }, { passive: false });

      item.addEventListener('touchend', () => {
        if (!dragging) return;
        dragging.classList.remove('dragging');
        const newOrder = [...list.querySelectorAll('.reorder-item')].map(el => el.dataset.id);
        blocks.sort((a, b) => newOrder.indexOf(a.id) - newOrder.indexOf(b.id));
        dragging = null;
        render();
      });
    });
  }

  function getDragAfterElement(container, y) {
    const draggableEls = [...container.querySelectorAll('.reorder-item:not(.dragging)')];
    return draggableEls.reduce((closest, child) => {
      const box = child.getBoundingClientRect();
      const offset = y - box.top - box.height / 2;
      if (offset < 0 && offset > closest.offset) return { offset, element: child };
      else return closest;
    }, { offset: -Infinity }).element;
  }

  // ============= ACTIONS =============
  function addBlock(prompt) {
    const id = 'b_' + Date.now();
    const loadingBlock = { id, type: 'loading', title: prompt, statusText: 'Searching your activity…' };
    blocks.push(loadingBlock);
    closeSheet();
    render();
    showToast('Generating block…');

    // Cycle status messages
    const stages = [
      'Searching your activity…',
      'Pulling recent sessions…',
      'Ranking by relevance…',
      'Building your carousel…'
    ];
    let stageIdx = 0;
    const stageInterval = setInterval(() => {
      stageIdx = (stageIdx + 1) % stages.length;
      const b = blocks.find(x => x.id === id);
      if (b && b.type === 'loading') {
        b.statusText = stages[stageIdx];
        // Update only the status text without full re-render
        const blockEl = blocksEl.children[blocks.indexOf(b)];
        const statusEl = blockEl?.querySelector('.loading-status span:last-child');
        if (statusEl) statusEl.textContent = stages[stageIdx];
      }
    }, 900);

    // Simulate AI response
    setTimeout(() => {
      clearInterval(stageInterval);
      const idx = blocks.findIndex(b => b.id === id);
      if (idx === -1) return;
      const data = inferContent(prompt);
      blocks[idx] = {
        id,
        type: 'ai',
        prompt,
        title: data.title,
        eyebrow: data.eyebrow,
        data
      };
      render();
      showToast('Block added');
    }, 2400);
  }

  function updateBlock(blockId, prompt) {
    const idx = blocks.findIndex(b => b.id === blockId);
    if (idx === -1) return;
    const id = blocks[idx].id;
    blocks[idx] = { id, type: 'loading', title: prompt, statusText: 'Refining your block…' };
    closeSheet();
    render();

    setTimeout(() => {
      const i = blocks.findIndex(b => b.id === id);
      if (i === -1) return;
      const data = inferContent(prompt);
      blocks[i] = {
        id,
        type: 'ai',
        prompt,
        title: data.title,
        eyebrow: data.eyebrow,
        data
      };
      render();
      showToast('Block updated');
    }, 1800);
  }

  function removeBlock(blockId) {
    blocks = blocks.filter(b => b.id !== blockId);
    closeSheet();
    render();
    showToast('Block removed');
  }

  // ============= TOAST =============
  const toastEl = document.getElementById('toast');
  let toastTimer;
  function showToast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove('show'), 2200);
  }

  // ============= INIT =============
  render();

  // Wire up persistent chat field to add a block
  document.getElementById('chat-field').onclick = () => openPromptSheet(null);
</script>
</body>
</html>
